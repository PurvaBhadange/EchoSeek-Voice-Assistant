services:
  - type: web
    name: echoseek-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && PYTHONPATH=backend python scripts/prepare_dataset_subset.py && PYTHONPATH=backend python scripts/generate_embeddings.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: backend
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
